name: Test basic dry-run patch bump
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
          release_branches: ".*"
          dry_run: "true"

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          NEW_VERSION: ${{ steps.action.outputs.new_version }}
          PREV_TAG: ${{ steps.action.outputs.previous_tag }}
          RELEASE_TYPE: ${{ steps.action.outputs.release_type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_tag: $NEW_TAG"
          echo "new_version: $NEW_VERSION"
          echo "previous_tag: $PREV_TAG"
          echo "release_type: $RELEASE_TYPE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NEW_TAG" ]; then
              echo "FAIL: action succeeded but new_tag is empty"
              exit 1
            fi
            if [ -z "$NEW_VERSION" ]; then
              echo "FAIL: action succeeded but new_version is empty"
              exit 1
            fi
            if [ -z "$PREV_TAG" ]; then
              echo "FAIL: action succeeded but previous_tag is empty"
              exit 1
            fi
            if [ -z "$RELEASE_TYPE" ]; then
              echo "FAIL: action succeeded but release_type is empty"
              exit 1
            fi
            case "$NEW_TAG" in
              v*)
                echo "PASS: new_tag starts with 'v'"
                ;;
              *)
                echo "FAIL: new_tag '$NEW_TAG' does not start with 'v'"
                exit 1
                ;;
            esac
            echo "PASS: all outputs set correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
