name: Test initial version baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: tag
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: 'true'
          # force_bump ensures we always get a version even with 0 eligible commits
          force_bump: 'minor'
          tag_prefix: 'v'
          # initial_version sets the semantic baseline when no matching tags exist;
          # here we use previous_version to explicitly set the baseline to 1.2.0
          initial_version: '1.2.0'
          # previous_version overrides the version used as the bump baseline
          previous_version: '1.2.0'
          # previous_tag must be a valid tag in the repository for the compare API
          previous_tag: 'v6.0.2'
          release_branches: '.*'
          # Use a real public repo so GitHub API calls succeed
          repository: 'actions/checkout'
          # Use a commit SHA that exists in actions/checkout (v6.0.2)
          commit_sha: 'de0fac2e4500dabe0009e67214ff5f5447ce83dd'

      - name: Assert new_tag is set
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag output is empty"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG"

      - name: Assert new_version is set
        env:
          NEW_VERSION: ${{ steps.tag.outputs.new_version }}
        run: |
          echo "new_version: $NEW_VERSION"
          if [ -z "$NEW_VERSION" ]; then
            echo "FAIL: new_version output is empty"
            exit 1
          fi
          echo "PASS: new_version=$NEW_VERSION"

      - name: Assert new_version is minor bump from baseline 1.2.0
        env:
          NEW_VERSION: ${{ steps.tag.outputs.new_version }}
        run: |
          echo "new_version: $NEW_VERSION"
          # With previous_version=1.2.0 and force_bump=minor, expect 1.3.0
          if [ "$NEW_VERSION" != "1.3.0" ]; then
            echo "FAIL: expected new_version='1.3.0' (minor bump from 1.2.0), got '$NEW_VERSION'"
            exit 1
          fi
          echo "PASS: new_version=$NEW_VERSION (minor bump from baseline 1.2.0)"

      - name: Assert previous_tag output is set
        env:
          PREVIOUS_TAG: ${{ steps.tag.outputs.previous_tag }}
        run: |
          echo "previous_tag: $PREVIOUS_TAG"
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "FAIL: previous_tag output is empty"
            exit 1
          fi
          echo "PASS: previous_tag=$PREVIOUS_TAG"

      - name: Assert changelog_url is set
        env:
          CHANGELOG_URL: ${{ steps.tag.outputs.changelog_url }}
        run: |
          echo "changelog_url: $CHANGELOG_URL"
          if [ -z "$CHANGELOG_URL" ]; then
            echo "FAIL: changelog_url output is empty"
            exit 1
          fi
          echo "PASS: changelog_url=$CHANGELOG_URL"
