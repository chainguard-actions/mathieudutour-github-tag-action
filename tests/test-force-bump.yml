name: Test force_bump overrides commit analysis
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: tag
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: 'true'
          force_bump: 'major'
          tag_prefix: 'v'
          release_branches: '.*'
          # Use a real public repo so GitHub API calls succeed
          repository: 'actions/checkout'
          # Use an older tag as baseline for the compare API
          previous_tag: 'v4.2.2'
          previous_version: '4.2.2'
          # Use a commit SHA that exists in actions/checkout (v6.0.2)
          commit_sha: 'de0fac2e4500dabe0009e67214ff5f5447ce83dd'

      - name: Assert release_type is major
        env:
          RELEASE_TYPE: ${{ steps.tag.outputs.release_type }}
        run: |
          echo "release_type: $RELEASE_TYPE"
          if [ "$RELEASE_TYPE" != "major" ]; then
            echo "FAIL: expected release_type='major', got '$RELEASE_TYPE'"
            exit 1
          fi
          echo "PASS: release_type=$RELEASE_TYPE"

      - name: Assert new_tag is set
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag output is empty"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG"

      - name: Assert new_version is set and looks like semver
        env:
          NEW_VERSION: ${{ steps.tag.outputs.new_version }}
        run: |
          echo "new_version: $NEW_VERSION"
          if [ -z "$NEW_VERSION" ]; then
            echo "FAIL: new_version output is empty"
            exit 1
          fi
          # Verify it looks like a semver
          if ! echo "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FAIL: new_version '$NEW_VERSION' does not look like semver"
            exit 1
          fi
          echo "PASS: new_version=$NEW_VERSION"

      - name: Assert major version is bumped from 4
        env:
          NEW_VERSION: ${{ steps.tag.outputs.new_version }}
        run: |
          echo "new_version: $NEW_VERSION"
          MAJOR=$(echo "$NEW_VERSION" | cut -d. -f1)
          echo "major: $MAJOR"
          if [ "$MAJOR" -le 4 ]; then
            echo "FAIL: expected major version > 4 (bumped from 4.2.2), got $MAJOR"
            exit 1
          fi
          echo "PASS: major version bumped to $MAJOR"
