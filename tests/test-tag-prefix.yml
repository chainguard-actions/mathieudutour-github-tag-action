name: Test custom tag prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: "true"
          custom_tag: "2.0.0"
          tag_prefix: "release-"
          release_branches: "act-harness,master,main"

      - name: Assert tag prefix applied (or graceful failure on sentinel repo)
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          NEW_VERSION: ${{ steps.action.outputs.new_version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_tag: $NEW_TAG"
          echo "new_version: $NEW_VERSION"

          if [ "$OUTCOME" = "success" ]; then
            if [ "$NEW_TAG" != "release-2.0.0" ]; then
              echo "FAIL: expected new_tag 'release-2.0.0' but got '$NEW_TAG'"
              exit 1
            fi
            echo "PASS: new_tag is 'release-2.0.0'"

            if [ "$NEW_VERSION" != "2.0.0" ]; then
              echo "FAIL: expected new_version '2.0.0' but got '$NEW_VERSION'"
              exit 1
            fi
            echo "PASS: new_version is '2.0.0'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
