name: Test custom tag dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/heads/act-harness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: "true"
          custom_tag: "2.5.0"
          tag_prefix: "v"
          release_branches: "act-harness,master,main"

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          NEW_VERSION: ${{ steps.action.outputs.new_version }}
          RELEASE_TYPE: ${{ steps.action.outputs.release_type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_tag: $NEW_TAG"
          echo "new_version: $NEW_VERSION"
          echo "release_type: $RELEASE_TYPE"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$NEW_TAG" != "v2.5.0" ]; then
              echo "FAIL: expected new_tag='v2.5.0', got '$NEW_TAG'"
              exit 1
            fi
            echo "PASS: new_tag=$NEW_TAG"
            if [ "$NEW_VERSION" != "2.5.0" ]; then
              echo "FAIL: expected new_version='2.5.0', got '$NEW_VERSION'"
              exit 1
            fi
            echo "PASS: new_version=$NEW_VERSION"
            if [ "$RELEASE_TYPE" != "custom" ]; then
              echo "FAIL: expected release_type='custom', got '$RELEASE_TYPE'"
              exit 1
            fi
            echo "PASS: release_type=$RELEASE_TYPE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
