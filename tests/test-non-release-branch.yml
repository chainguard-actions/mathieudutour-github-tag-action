name: Test non-release branch behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # act-harness branch is NOT in release_branches (master,main only)
      # so the action should compute a version with commit hash suffix and not push a tag
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
          release_branches: "master,main"

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          NEW_VERSION: ${{ steps.action.outputs.new_version }}
          PREV_TAG: ${{ steps.action.outputs.previous_tag }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_tag: $NEW_TAG"
          echo "new_version: $NEW_VERSION"
          echo "previous_tag: $PREV_TAG"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NEW_TAG" ]; then
              echo "FAIL: action succeeded but new_tag is empty"
              exit 1
            fi
            if [ -z "$NEW_VERSION" ]; then
              echo "FAIL: action succeeded but new_version is empty"
              exit 1
            fi
            if [ -z "$PREV_TAG" ]; then
              echo "FAIL: action succeeded but previous_tag is empty"
              exit 1
            fi
            # For non-release branch, no tag should be pushed
            git fetch --tags
            if git tag | grep -qxF "$NEW_TAG"; then
              echo "FAIL: tag '$NEW_TAG' was pushed for a non-release branch"
              exit 1
            fi
            echo "PASS: non-release branch outputs set, no tag pushed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
