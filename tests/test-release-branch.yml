name: Test release branch bump
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: "true"
          default_bump: "major"
          release_branches: "act-harness,master,main"

      - name: Assert major bump outputs (or graceful failure on sentinel repo)
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          NEW_VERSION: ${{ steps.action.outputs.new_version }}
          PREVIOUS_TAG: ${{ steps.action.outputs.previous_tag }}
          RELEASE_TYPE: ${{ steps.action.outputs.release_type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_tag: $NEW_TAG"
          echo "new_version: $NEW_VERSION"
          echo "previous_tag: $PREVIOUS_TAG"
          echo "release_type: $RELEASE_TYPE"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NEW_TAG" ]; then
              echo "FAIL: action succeeded but new_tag output is empty"
              exit 1
            fi
            echo "PASS: new_tag is '$NEW_TAG'"

            # On a release branch with major bump, release_type should be 'major'
            if [ "$RELEASE_TYPE" != "major" ]; then
              echo "FAIL: expected release_type 'major' but got '$RELEASE_TYPE'"
              exit 1
            fi
            echo "PASS: release_type is 'major'"

            # new_tag should start with 'v'
            case "$NEW_TAG" in
              v*) echo "PASS: new_tag starts with 'v'" ;;
              *)  echo "FAIL: new_tag '$NEW_TAG' does not start with 'v'"; exit 1 ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
