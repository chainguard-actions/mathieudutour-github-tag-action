name: Test previous_tag and previous_version override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: tag
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: 'true'
          # Use a real tag from actions/checkout as previous_tag
          previous_tag: 'v4.2.2'
          # Override the semantic version baseline to test the override feature
          previous_version: '2.0.0'
          # Use force_bump to ensure deterministic patch bump regardless of commit analysis
          force_bump: 'patch'
          tag_prefix: 'v'
          release_branches: '.*'
          # Use a real public repo so GitHub API calls succeed
          repository: 'actions/checkout'
          # Use a commit SHA that exists in actions/checkout (v6.0.2, after v4.2.2)
          commit_sha: 'de0fac2e4500dabe0009e67214ff5f5447ce83dd'

      - name: Assert previous_tag output matches input
        env:
          PREVIOUS_TAG: ${{ steps.tag.outputs.previous_tag }}
        run: |
          echo "previous_tag: $PREVIOUS_TAG"
          if [ "$PREVIOUS_TAG" != "v4.2.2" ]; then
            echo "FAIL: expected previous_tag='v4.2.2', got '$PREVIOUS_TAG'"
            exit 1
          fi
          echo "PASS: previous_tag=$PREVIOUS_TAG"

      - name: Assert previous_version output matches override input
        env:
          PREVIOUS_VERSION: ${{ steps.tag.outputs.previous_version }}
        run: |
          echo "previous_version: $PREVIOUS_VERSION"
          if [ "$PREVIOUS_VERSION" != "2.0.0" ]; then
            echo "FAIL: expected previous_version='2.0.0', got '$PREVIOUS_VERSION'"
            exit 1
          fi
          echo "PASS: previous_version=$PREVIOUS_VERSION"

      - name: Assert new_tag is set and bumped from 2.0.0
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
          NEW_VERSION: ${{ steps.tag.outputs.new_version }}
        run: |
          echo "new_tag: $NEW_TAG"
          echo "new_version: $NEW_VERSION"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag output is empty"
            exit 1
          fi
          # With previous_version=2.0.0 and force_bump=patch, expect 2.0.1
          if [ "$NEW_VERSION" != "2.0.1" ]; then
            echo "FAIL: expected new_version='2.0.1' (patch bump from 2.0.0), got '$NEW_VERSION'"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG, new_version=$NEW_VERSION"
