name: Test commit_sha input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Get current commit SHA
        id: get-sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Current SHA: $SHA"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          dry_run: "true"
          commit_sha: ${{ steps.get-sha.outputs.sha }}
          default_bump: "patch"
      - name: Assert action ran with commit_sha
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          NEW_VERSION: ${{ steps.action.outputs.new_version }}
          RELEASE_TYPE: ${{ steps.action.outputs.release_type }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_tag: $NEW_TAG"
          echo "new_version: $NEW_VERSION"
          echo "release_type: $RELEASE_TYPE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NEW_TAG" ]; then
              echo "FAIL: action succeeded but new_tag is empty"
              exit 1
            fi
            echo "PASS: got new_tag='$NEW_TAG'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
