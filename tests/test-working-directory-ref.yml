name: Test working directory and ref inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: 'true'
          push: 'false'
          working_directory: '.'
          ref: 'act-harness'
          default_bump: 'patch'
      - name: Assert new_tag is set
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          NEW_VERSION: ${{ steps.action.outputs.new_version }}
          PREVIOUS_TAG: ${{ steps.action.outputs.previous_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          echo "new_version: $NEW_VERSION"
          echo "previous_tag: $PREVIOUS_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: expected new_tag to be set"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG"
