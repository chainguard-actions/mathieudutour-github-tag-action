name: Test tag search pattern and repository URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: 'true'
          push: 'false'
          tag_search_pattern: 'v*'
          repository_url: 'https://github.com/mathieudutour/github-tag-action'
          default_bump: 'patch'
      - name: Assert new_tag is set
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          NEW_VERSION: ${{ steps.action.outputs.new_version }}
          CHANGELOG_URL: ${{ steps.action.outputs.changelog_url }}
        run: |
          echo "new_tag: $NEW_TAG"
          echo "new_version: $NEW_VERSION"
          echo "changelog_url: $CHANGELOG_URL"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: expected new_tag to be set"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG"
