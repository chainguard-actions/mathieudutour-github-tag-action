name: Test changelog output generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: tag
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: 'true'
          # force_bump ensures we always get a version even with 0 eligible commits
          force_bump: 'patch'
          tag_prefix: 'v'
          initial_version: '0.0.0'
          release_branches: '.*'
          commit_analyzer_preset: 'conventionalcommits'
          # Use a real public repo so GitHub API calls succeed
          repository: 'actions/checkout'
          # Use an older tag as baseline so compare has commits
          previous_tag: 'v4.2.2'
          previous_version: '4.2.2'
          # Use a commit SHA that exists in actions/checkout (v6.0.2)
          commit_sha: 'de0fac2e4500dabe0009e67214ff5f5447ce83dd'

      - name: Assert new_tag is set
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag output is empty"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG"

      - name: Assert changelog output is present or empty (acceptable)
        env:
          CHANGELOG: ${{ steps.tag.outputs.changelog }}
        run: |
          echo "changelog: $CHANGELOG"
          echo "PASS: changelog output checked (may be empty if no conventional commits in range)"

      - name: Assert changelog_url is set
        env:
          CHANGELOG_URL: ${{ steps.tag.outputs.changelog_url }}
        run: |
          echo "changelog_url: $CHANGELOG_URL"
          if [ -z "$CHANGELOG_URL" ]; then
            echo "FAIL: changelog_url output is empty"
            exit 1
          fi
          echo "PASS: changelog_url=$CHANGELOG_URL"

      - name: Assert release_type is set
        env:
          RELEASE_TYPE: ${{ steps.tag.outputs.release_type }}
        run: |
          echo "release_type: $RELEASE_TYPE"
          if [ -z "$RELEASE_TYPE" ]; then
            echo "FAIL: release_type output is empty"
            exit 1
          fi
          echo "PASS: release_type=$RELEASE_TYPE"
