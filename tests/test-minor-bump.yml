name: Test minor bump type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: "true"
          default_bump: "minor"
          release_branches: "act-harness,master,main"

      - name: Assert minor bump outputs (or graceful failure on sentinel repo)
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          NEW_VERSION: ${{ steps.action.outputs.new_version }}
          RELEASE_TYPE: ${{ steps.action.outputs.release_type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_tag: $NEW_TAG"
          echo "new_version: $NEW_VERSION"
          echo "release_type: $RELEASE_TYPE"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NEW_TAG" ]; then
              echo "FAIL: action succeeded but new_tag output is empty"
              exit 1
            fi
            echo "PASS: new_tag is '$NEW_TAG'"

            # On a release branch with minor bump, release_type should be 'minor'
            if [ "$RELEASE_TYPE" != "minor" ]; then
              echo "FAIL: expected release_type 'minor' but got '$RELEASE_TYPE'"
              exit 1
            fi
            echo "PASS: release_type is 'minor'"

            # new_version should be a semver like X.Y.Z
            if echo "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "PASS: new_version '$NEW_VERSION' is valid semver"
            else
              echo "FAIL: new_version '$NEW_VERSION' is not valid semver X.Y.Z"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
