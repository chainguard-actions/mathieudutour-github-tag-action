name: Test local tag creation (push=false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Fetch the target commit into local repo
        run: |
          # Fetch the v6.0.2 tag from actions/checkout so the commit SHA is available locally
          git fetch --no-tags https://github.com/actions/checkout \
            refs/tags/v6.0.2:refs/tags/checkout-v6.0.2
          # Verify the commit SHA is now resolvable locally
          git rev-parse --verify de0fac2e4500dabe0009e67214ff5f5447ce83dd
          echo "Fetched commit is available locally"

      - id: tag
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push: 'false'
          create_local_tag: 'true'
          custom_tag: '1.0.0'
          tag_prefix: 'v'
          release_branches: '.*'
          # Use a real public repo so GitHub API calls succeed
          repository: 'actions/checkout'
          # Use an older tag as baseline for the compare API
          previous_tag: 'v4.2.2'
          previous_version: '4.2.2'
          # Use a commit SHA that exists in actions/checkout AND is now in local repo
          commit_sha: 'de0fac2e4500dabe0009e67214ff5f5447ce83dd'

      - name: Assert new_tag output is set
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          echo "new_tag: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "FAIL: new_tag output is empty"
            exit 1
          fi
          echo "PASS: new_tag=$NEW_TAG"

      - name: Assert local tag was created
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          echo "Checking for local tag: $NEW_TAG"
          if ! git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "FAIL: local tag $NEW_TAG was not created"
            exit 1
          fi
          echo "PASS: local tag $NEW_TAG exists"

      - name: Assert new_version is set correctly
        env:
          NEW_VERSION: ${{ steps.tag.outputs.new_version }}
        run: |
          echo "new_version: $NEW_VERSION"
          if [ "$NEW_VERSION" != "1.0.0" ]; then
            echo "FAIL: expected new_version='1.0.0', got '$NEW_VERSION'"
            exit 1
          fi
          echo "PASS: new_version=$NEW_VERSION"
