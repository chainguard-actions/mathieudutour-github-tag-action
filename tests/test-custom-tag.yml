name: Test custom tag input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: "99.88.77"
          tag_prefix: v
          release_branches: ".*"
          dry_run: "true"

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          NEW_TAG: ${{ steps.action.outputs.new_tag }}
          NEW_VERSION: ${{ steps.action.outputs.new_version }}
          RELEASE_TYPE: ${{ steps.action.outputs.release_type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_tag: $NEW_TAG"
          echo "new_version: $NEW_VERSION"
          echo "release_type: $RELEASE_TYPE"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$NEW_TAG" != "v99.88.77" ]; then
              echo "FAIL: expected new_tag='v99.88.77' but got '$NEW_TAG'"
              exit 1
            fi
            if [ "$NEW_VERSION" != "99.88.77" ]; then
              echo "FAIL: expected new_version='99.88.77' but got '$NEW_VERSION'"
              exit 1
            fi
            if [ "$RELEASE_TYPE" != "custom" ]; then
              echo "FAIL: expected release_type='custom' but got '$RELEASE_TYPE'"
              exit 1
            fi
            echo "PASS: all outputs set correctly for custom tag"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
